{% if distributions %}
<table class="dist-table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Service</th>
      <th>Type</th>
      <th>Tag</th>
      <th>Cloud Reference</th>
    </tr>
  </thead>
  <tbody>
    {% for d in distributions %}
    <tr>
      <td><a href="/distributions/{{ d.id }}">{{ d.id }}</a></td>
      <td><span class="badge svc-{{ d.service | lower }}">{{ d.service }}</span></td>
      <td>{{ d.type | default('—') }}</td>
      <td>{{ d.distribution_tag | default('—') }}</td>
      <td class="ref">{{ d.message_cloud_reference | default('—') }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="empty">No distributions found.</p>
{% endif %}
