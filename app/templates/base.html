<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SwiftOps{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="/" class="brand">SwiftOps</a>
      <span class="subtitle">Swift Alliance Cloud Dashboard</span>
      <div class="stack-status"
           hx-get="/api/status"
           hx-trigger="load, every 30s"
           hx-swap="innerHTML">
        <span class="dot grey"></span> checking…
      </div>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
